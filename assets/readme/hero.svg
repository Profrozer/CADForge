<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="CADForge - Prompt to Parametric Solid">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgBase" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="50%" stop-color="#070e22"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="75%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0044aa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050b18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#0055ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#03060d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cadGridMajor" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
    <pattern id="cadGridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-opacity="0.025" stroke-width="0.75"/>
    </pattern>

    <!-- Isometric Part Facet Gradients -->
    <linearGradient id="facetTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="facetFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c1e33" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="facetArmTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Toolpath Laser Gradient -->
    <linearGradient id="laserBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bloom">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3.5px; fill-opacity: 0.6; }
        50% { r: 6px; fill-opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes toolHead {
        0% { transform: translate(0, 0); }
        25% { transform: translate(140px, -73px); }
        50% { transform: translate(220px, -27px); }
        75% { transform: translate(80px, 46px); }
        100% { transform: translate(0, 0); }
      }

      .cad-radar { transform-origin: 940px 210px; animation: radarSweep 14s linear infinite; }
      .cad-scan { animation: scanLine 4s ease-in-out infinite; }
      .pipeline-dash { stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
      .term-cursor { animation: blinkCursor 1s step-end infinite; }
      .tool-nozzle { animation: toolHead 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgBase)"/>
  <rect width="1200" height="400" fill="url(#glowTopRight)"/>
  <rect width="1200" height="400" fill="url(#glowBottomLeft)"/>
  <rect width="1200" height="400" fill="url(#cadGridMinor)"/>
  <rect width="1200" height="400" fill="url(#cadGridMajor)"/>

  <!-- Technical HUD Border & Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Top Left -->
    <path d="M 20 50 L 20 20 L 50 20"/>
    <circle cx="20" cy="20" r="2" fill="#38bdf8"/>
    <!-- Top Right -->
    <path d="M 1150 20 L 1180 20 L 1180 50"/>
    <circle cx="1180" cy="20" r="2" fill="#38bdf8"/>
    <!-- Bottom Left -->
    <path d="M 20 350 L 20 380 L 50 380"/>
    <circle cx="20" cy="380" r="2" fill="#38bdf8"/>
    <!-- Bottom Right -->
    <path d="M 1150 380 L 1180 380 L 1180 350"/>
    <circle cx="1180" cy="380" r="2" fill="#38bdf8"/>
  </g>

  <!-- Precision Measurement Scales -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1">
    <!-- Top Ruler -->
    <line x1="200" y1="20" x2="1000" y2="20"/>
    <line x1="300" y1="20" x2="300" y2="26"/>
    <line x1="400" y1="20" x2="400" y2="26"/>
    <line x1="500" y1="20" x2="500" y2="29"/>
    <line x1="600" y1="20" x2="600" y2="26"/>
    <line x1="700" y1="20" x2="700" y2="26"/>
    <line x1="800" y1="20" x2="800" y2="29"/>
    <line x1="900" y1="20" x2="900" y2="26"/>

    <!-- Left Ruler -->
    <line x1="20" y1="80" x2="20" y2="320"/>
    <line x1="20" y1="120" x2="26" y2="120"/>
    <line x1="20" y1="160" x2="26" y2="160"/>
    <line x1="20" y1="200" x2="29" y2="200"/>
    <line x1="20" y1="240" x2="26" y2="240"/>
    <line x1="20" y1="280" x2="26" y2="280"/>
  </g>

  <!-- Coordinate Calibration Marks -->
  <text x="35" y="32" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="9" fill="#38bdf8" opacity="0.65" letter-spacing="2">SYS: OCC_7.7.0 // PY_CADQUERY_2.4</text>
  <text x="1165" y="32" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="9" fill="#38bdf8" opacity="0.65" letter-spacing="2">TOLERANCE: 0.001mm [CSG SOLID]</text>

  <!-- ================= RIGHT SECTION: ISOMETRIC CAD STAGE ================= -->
  <g id="cadViewport">
    <!-- Viewport Background Ambient Glow -->
    <ellipse cx="940" cy="210" rx="190" ry="140" fill="url(#forgeGlow)"/>

    <!-- Reticle & Axis Target Rings -->
    <circle cx="940" cy="210" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-dasharray="4 6"/>
    <circle cx="940" cy="210" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-dasharray="2 4"/>
    <circle cx="940" cy="210" r="25" fill="none" stroke="#38bdf8" stroke-opacity="0.2"/>

    <!-- Radar Sweep Effect -->
    <g class="cad-radar">
      <line x1="940" y1="210" x2="1080" y2="210" stroke="url(#laserBeam)" stroke-width="1.5" opacity="0.4"/>
      <path d="M 940 210 L 1070 180 A 140 140 0 0 1 1080 210 Z" fill="#38bdf8" fill-opacity="0.03"/>
    </g>

    <!-- Calibration Crosshairs -->
    <line x1="940" y1="65" x2="940" y2="355" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="3 3"/>
    <line x1="770" y1="210" x2="1110" y2="210" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="3 3"/>

    <!-- Laser Scan Line animating vertically across the part -->
    <g class="cad-scan">
      <line x1="790" y1="110" x2="1090" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" filter="url(#subtleGlow)"/>
      <polygon points="785,110 790,107 790,113" fill="#38bdf8" opacity="0.8"/>
      <polygon points="1095,110 1090,107 1090,113" fill="#38bdf8" opacity="0.8"/>
    </g>

    <!-- ISOMETRIC SOLID: PARAMETRIC L-BRACKET -->
    <!-- Base Arm (Horizontal) -->
    <!-- Top Face -->
    <polygon points="810,195 950,122 1050,174 910,247" fill="url(#facetTop)" filter="url(#subtleGlow)"/>
    <!-- Right Face -->
    <polygon points="950,122 1050,174 1050,204 950,152" fill="url(#facetRight)"/>
    <!-- Front Face -->
    <polygon points="810,195 910,247 910,277 810,225" fill="url(#facetFront)"/>

    <!-- Vertical Arm -->
    <!-- Top Face -->
    <polygon points="810,100 865,71 965,123 910,152" fill="url(#facetArmTop)" filter="url(#subtleGlow)"/>
    <!-- Right Face -->
    <polygon points="865,71 965,123 965,153 865,101" fill="url(#facetRight)"/>
    <!-- Front Face -->
    <polygon points="810,100 910,152 910,247 810,195" fill="url(#facetFront)"/>

    <!-- Precision Wireframe Outlines & Fillet Highlights -->
    <g stroke="#38bdf8" stroke-width="1.4" fill="none" opacity="0.85" filter="url(#subtleGlow)">
      <!-- Top Contour -->
      <polyline points="810,100 865,71 965,123 1050,167"/>
      <!-- Outer Edge -->
      <polyline points="1050,174 1050,204 910,277 810,225 810,100"/>
      <!-- Inner Seams -->
      <line x1="910" y1="152" x2="910" y2="247"/>
      <line x1="810" y1="195" x2="910" y2="247"/>
      <line x1="910" y1="247" x2="1050" y2="174"/>
      <line x1="965" y1="123" x2="965" y2="153"/>
    </g>

    <!-- Bolt Holes (Bores) -->
    <!-- Hole 1 -->
    <ellipse cx="905" cy="207" rx="12" ry="7.5" fill="#040b17" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <ellipse cx="905" cy="209" rx="8" ry="4.5" fill="#02060e" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
    <!-- Hole 2 -->
    <ellipse cx="985" cy="165" rx="12" ry="7.5" fill="#040b17" stroke="#38bdf8" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <ellipse cx="985" cy="167" rx="8" ry="4.5" fill="#02060e" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>

    <!-- Corner Fillet Dimension Arc -->
    <path d="M 1045,178 A 14,9 0 0 1 1052,170" stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.85"/>
    <text x="1062" y="171" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#f59e0b" opacity="0.9">R3.0</text>

    <!-- Animated CNC Toolhead Laser Tracer -->
    <g class="tool-nozzle">
      <circle cx="810" cy="195" r="4" fill="#f59e0b" filter="url(#bloom)"/>
      <circle cx="810" cy="195" r="1.5" fill="#ffffff"/>
      <line x1="810" y1="195" x2="810" y2="150" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
      <polygon points="806,150 814,150 810,140" fill="#f59e0b" opacity="0.9"/>
      <text x="817" y="146" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f59e0b" opacity="0.9">TOOLHEAD</text>
    </g>

    <!-- 3D Coordinate Triad -->
    <g transform="translate(800, 310)" filter="url(#subtleGlow)">
      <!-- Origin -->
      <circle cx="0" cy="0" r="3" fill="#38bdf8"/>
      <!-- X Axis (Red) -->
      <line x1="0" y1="0" x2="45" y2="15" stroke="#ef4444" stroke-width="2"/>
      <text x="50" y="19" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">X</text>
      <!-- Y Axis (Green) -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#22c55e" stroke-width="2"/>
      <text x="-4" y="-50" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#22c55e">Z</text>
      <!-- Z/Depth Axis (Blue) -->
      <line x1="0" y1="0" x2="-35" y2="18" stroke="#3b82f6" stroke-width="2"/>
      <text x="-48" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#3b82f6">Y</text>
    </g>

    <!-- Engineering Dimension Annotations -->
    <g stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" fill="none">
      <!-- Horizontal Dimension: 80 mm -->
      <line x1="810" y1="292" x2="1050" y2="219"/>
      <line x1="810" y1="285" x2="810" y2="299"/>
      <line x1="1050" y1="212" x2="1050" y2="226"/>

      <!-- Vertical Dimension: 60 mm -->
      <line x1="775" y1="100" x2="775" y2="225"/>
      <line x1="768" y1="100" x2="782" y2="100"/>
      <line x1="768" y1="225" x2="782" y2="225"/>
    </g>
    <text x="940" y="270" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="1">80.00 mm</text>
    <text x="758" y="167" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="1" transform="rotate(-90 758 167)">60.00 mm</text>
    <text x="955" y="196" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f59e0b" opacity="0.85">2x ⌀6.00 THRU</text>
  </g>

  <!-- ================= LEFT SECTION: BRAND & SPECS ================= -->
  <g transform="translate(60, 0)">
    <!-- Terminal Prompt Eyebrow -->
    <g transform="translate(0, 85)">
      <rect x="0" y="-16" width="220" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <circle cx="12" cy="-4" r="3" fill="#22c55e"/>
      <text x="24" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="1.5">PROMPT-TO-CAD ENGINE</text>
    </g>

    <!-- Main Wordmark -->
    <g transform="translate(0, 165)">
      <!-- Glow Underlay -->
      <text x="0" y="0" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="#38bdf8" opacity="0.15" filter="url(#bloom)">CADFORGE</text>
      <!-- Split Solid Text -->
      <text x="0" y="0" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="#f8fafc">CAD</text>
      <text x="175" y="0" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="78" font-weight="900" letter-spacing="-2" fill="#38bdf8">FORGE</text>
    </g>

    <!-- Tagline & Description -->
    <text x="2" y="202" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="16.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Natural language mechanical engineering. Generates verified CSG solids.
    </text>

    <!-- Interactive Prompt Simulation Box -->
    <g transform="translate(0, 226)">
      <rect x="0" y="0" width="530" height="42" rx="6" fill="#090f1d" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" font-weight="600">&gt;</text>
      <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0">
        "L-bracket 80x60mm, 5mm thick, two 6mm bolt holes"
      </text>
      <rect x="472" y="14" width="8" height="15" fill="#38bdf8" class="term-cursor"/>
    </g>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(0, 290)">
      <!-- CadQuery -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
        <text x="22" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0">CadQuery</text>
      </g>
      <!-- OpenCASCADE -->
      <g transform="translate(115, 0)">
        <rect width="128" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
        <text x="22" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0">OpenCASCADE</text>
      </g>
      <!-- Three.js -->
      <g transform="translate(253, 0)">
        <rect width="90" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
        <text x="22" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0">Three.js</text>
      </g>
      <!-- Exports Pill -->
      <g transform="translate(353, 0)">
        <rect width="177" height="26" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#a5b4fc"/>
        <text x="22" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#c7d2fe">STEP · STL · OBJ · DXF</text>
      </g>
    </g>

    <!-- Providers Row & Offline Mode Badge -->
    <g transform="translate(0, 342)">
      <!-- Offline Badge -->
      <rect x="0" y="0" width="168" height="24" rx="4" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ade80" letter-spacing="1">ZERO-CONFIG MOCK</text>

      <!-- Provider List -->
      <text x="185" y="16" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748b">
        AI Engines: <tspan fill="#cbd5e1">Claude</tspan> · <tspan fill="#cbd5e1">OpenAI</tspan> · <tspan fill="#cbd5e1">Codex</tspan> · <tspan fill="#cbd5e1">GLM</tspan> · <tspan fill="#cbd5e1">NVIDIA NIM</tspan> · <tspan fill="#cbd5e1">Ollama</tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHTMOST VERTICAL PIPELINE STATUS ================= -->
  <g transform="translate(1120, 90)">
    <!-- Vertical Conduit Line -->
    <line x1="20" y1="20" x2="20" y2="220" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="20" y1="20" x2="20" y2="220" stroke="#38bdf8" stroke-width="2" class="pipeline-dash"/>

    <!-- Step 1: Prompt -->
    <g transform="translate(20, 20)">
      <circle cx="0" cy="0" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
      <text x="-12" y="4" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#38bdf8">PROMPT</text>
    </g>
    <!-- Step 2: Spec -->
    <g transform="translate(20, 85)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" opacity="0.8"/>
      <text x="-12" y="4" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94a3b8">SPEC</text>
    </g>
    <!-- Step 3: Python -->
    <g transform="translate(20, 150)">
      <circle cx="0" cy="0" r="4" fill="#38bdf8" opacity="0.8"/>
      <text x="-12" y="4" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94a3b8">CODE</text>
    </g>
    <!-- Step 4: Solid -->
    <g transform="translate(20, 215)">
      <circle cx="0" cy="0" r="5" fill="#f59e0b" filter="url(#bloom)"/>
      <text x="-12" y="4" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#f59e0b">SOLID</text>
    </g>
  </g>
</svg>
